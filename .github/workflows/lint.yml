# An empty or malformed config.yaml does not fail loudly: the Supervisor simply
# stops listing the add-on, and the store shows nothing where it used to be.
# This catches that before it is pushed.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-config:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the add-on config
        uses: frenck/action-addon-linter@v2
        with:
          path: "./codex"

  usage-bridge:
    name: Usage bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: |
          for f in codex/rootfs/usr/share/codex-addon/usage-bridge/*.js; do
            node --check "$f"
          done

  entrypoint:
    name: Entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: bash -n codex/rootfs/usr/bin/codex-addon-start.sh
