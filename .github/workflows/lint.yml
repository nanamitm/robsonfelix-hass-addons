# A broken add-on config does not fail loudly: the Supervisor stops listing the
# add-on and the store shows nothing where it used to be. v0.2.2 shipped an
# empty config.yaml exactly that way. The checks below are what stands between
# that and a push.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  addon-config:
    name: Add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check structure
        run: python .github/scripts/check_addon_config.py

  addon-linter:
    name: Add-on linter (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose. This linter also reports style opinions that this
    # add-on does not follow: it treats writing a default value out explicitly
    # as an error. Its findings are worth reading; they are not worth blocking
    # a release that fixes something.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./codex"

  usage-bridge:
    name: Usage bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          for f in codex/rootfs/usr/share/codex-addon/usage-bridge/*.js; do
            node --check "$f"
          done

  entrypoint:
    name: Entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check syntax
        run: bash -n codex/rootfs/usr/bin/codex-addon-start.sh
