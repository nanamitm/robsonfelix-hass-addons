name: Codex
description: Run OpenAI Codex CLI inside Home Assistant to create automations, debug issues, and manage your smart home configuration
version: "0.1.4"
slug: codex
url: https://github.com/nanamitm/robsonfelix-hass-addons
# Codex publishes Linux binaries for x86_64 and aarch64 musl only, so armv7,
# armhf and i386 - which the Claude Code add-on this is derived from supports -
# cannot be built here.
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:code-braces-box
panel_title: Codex
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
uart: true
docker_api: true
full_access: true
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw
  - backup:ro
options:
  enable_mcp: true
  enable_playwright_mcp: false
  playwright_cdp_host: ""
  model: ""
  approval_policy: on-request
  sandbox_mode: danger-full-access
  model_reasoning_effort: default
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: true
  auto_update_codex: true
schema:
  enable_mcp: bool
  enable_playwright_mcp: bool
  playwright_cdp_host: str?
  model: str?
  approval_policy: list(untrusted|on-request|never)
  sandbox_mode: list(read-only|workspace-write|danger-full-access)
  model_reasoning_effort: list(default|none|minimal|low|medium|high|xhigh)
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  auto_update_codex: bool
environment:
  TERM: xterm-256color
